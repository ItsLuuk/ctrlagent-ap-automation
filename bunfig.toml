[test]
# tests/e2e belongs to Playwright. Bare `bun test` must run the unit suite —
# without this it also discovers the e2e specs, which error before src ever runs.
pathIgnorePatterns = ["tests/e2e/**"]

[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
